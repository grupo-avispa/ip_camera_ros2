# Simple set of rules for GitHub actions integration with a ROS project
#

name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install-depth-anything:
    name: Install IpCamera
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@0.7.16
        with:
          required-ros-distributions: jazzy
      - name: Build packages
        uses: ros-tooling/action-ros-ci@0.4.7
        with:
          package-name: ip_camera_ros2
          target-ros2-distro: jazzy
          colcon-defaults: |
            {
              "build": {
                "mixin": ["coverage-gcc", "coverage-pytest"]
              },
              "test": {
                "mixin": ["coverage-pytest"]
              }
            }
          skip-tests: true
